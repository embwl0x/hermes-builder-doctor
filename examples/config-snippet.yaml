# Optional generic Hermes guidance snippet.
# Merge ideas from this file into your own config; do not overwrite production
# config blindly.

agent:
  environment_hint: >
    For any software build with an explicit project path, including small
    probes, use the builder-doctor toolset naturally: create the project root
    with `terminal mkdir -p` first, never `write_file` on the project root
    path, then builder_map and builder_plan before source/test edits,
    builder_doctor for a quick diagnostic scan,
    builder_budget after source/test batches, builder_resume at phase
    boundaries, builder_verify for bounded checks, and builder_receipt before
    final handoff. Build super-complex requests as staged verified kernels
    instead of one large burst.

platform_hints:
  api_server:
    append: >
      For app/project creation, repair, refactor, test, or verification
      requests that include a project path, use builder-doctor even if the
      requested build is small. Create the project root with `terminal mkdir -p`
      first for new projects, never `write_file` on the project root path, then
      map, plan, and run a quick diagnostic scan before writing source batches.
      Use builder_budget before widening scope and
      builder_verify for build/test/check commands rather than repeated ad hoc
      terminal loops.
